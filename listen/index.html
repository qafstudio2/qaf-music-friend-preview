<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>音樂｜QAF.</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,"Noto Sans TC",sans-serif}main{max-width:960px;margin:auto;padding:24px clamp(16px,4vw,40px)}header{display:flex;justify-content:space-between;align-items:center;min-height:72px;border-bottom:1px solid #171717}.brand{font-size:26px;font-weight:700;letter-spacing:.04em}h1{font-size:clamp(30px,5vw,46px);font-weight:400;margin:34px 0 24px}p{line-height:1.7}a{display:inline-block;color:#171717;border-bottom:1px solid #171717;padding:8px 0;text-decoration:none;font-size:19px}a:hover{background:#fff}
  </style>
</head>
<body>
  <main><header><span class="brand">QAF.</span><span>MUSIC</span></header><h1>音樂</h1><p id="status">正在檢查登入狀態…</p><a id="open-player" href="/account/start?next=player">登入後聽音樂 →</a></main>
  <script>
    (async () => {
      const destination = '/private/music#my-music';
      try {
        const response = await fetch('/account/whoami', {credentials:'same-origin',cache:'no-store'});
        if (response.ok) { location.replace(destination); return; }
        if (response.status === 401) { location.replace('/account/start?next=player'); return; }
      } catch {}
      document.getElementById('status').textContent = '目前無法確認登入狀態，請按下方連結進入。';
    })();
  </script>
</body>
</html>
