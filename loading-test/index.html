function tick(stamp){if(!playing||held)return;if(!lastStamp)lastStamp=stamp;const delta=Math.min(stamp-lastStamp,80);lastStamp=stamp;render(elapsed+delta*Number($('#speed').value));if(elapsed>=duration)finish();else raf=requestAnimationFrame(tick);}

 const doc=getDoc();if(!doc){finish('skip');return;}frame.contentWindow.scrollTo({top:0,behavior:'instant'});playing=true;held=false;elapsed=0;lastStamp=0;scene.classList.remove('finished','loading');scene.classList.add('playing');scene.setAttribute('aria-busy','true');$('.intro').setAttribute('aria-hidden','false');$('#skip').tabIndex=0;$('#status').textContent='片頭動態播放中，可隨時跳過。';
 animate($('.veil'),[{opacity:1},{opacity:0}],1850,2200,'cubic-bezier(.4,0,.2,1)');
 animate($('.intro-logo'),[{opacity:0,transform:'translate(-50%,calc(-50% + 19px))',offset:0},{opacity:1,transform:'translate(-50%,-50%)',offset:.45},{opacity:1,transform:'translate(-50%,-50%)',offset:.62},{opacity:0,transform:'translate(-50%,calc(-50% - 9px))',offset:1}],100,2760,'cubic-bezier(.2,.65,.2,1)');
 animate(doc.querySelector('.site-brand>div'),[{opacity:0,transform:'translateY(-95px)'},{opacity:1,transform:'translateY(0)'}],2210,1540,'cubic-bezier(.16,1,.3,1)');
 animate(doc.querySelector('.site-logo'),[{opacity:0,transform:'translateY(-15px)'},{opacity:1,transform:'translateY(0)'}],2670,1080,'cubic-bezier(.16,1,.3,1)');
 // Move the real existing news content as a group; it retains its own exact layout and behavior.
 animate(doc.querySelector('#main'),[{opacity:0,transform:'translateY(75vh)',offset:0},{opacity:1,transform:'translateY(-13px)',offset:.73},{opacity:1,transform:'translateY(3px)',offset:.89},{opacity:1,transform:'translateY(0)',offset:1}],1590,2170,'cubic-bezier(.16,.72,.26,1)');
 Array.from(doc.querySelectorAll('.primary-nav,.preview-note,.utility-nav,.site-footer')).forEach((el,i)=>animate(el,[{opacity:0},{opacity:1}],2700+i*60,1050));
 animate($('#progress'),[{opacity:0,offset:0},{opacity:1,offset:.08},{opacity:1,offset:.79},{opacity:0,offset:1}],200,3660);
 animate($('.skip'),[{opacity:1},{opacity:0}],3430,650);render(0);raf=requestAnimationFrame(tick);
}
function markReady(){if(ready)return;ready=true;clearTimeout(readyTimeout);clearTimeout(loadTimeout);observer?.disconnect();$('#replay').disabled=false;$('#readiness').textContent='';if(autoStart&&!reduced.checked)replay();else finish(reduced.checked?'reduced':'skip');}
function inspectReady(){const doc=getDoc();if(!doc)return;const news=doc.querySelector('#news-digest');if(news&&doc.querySelector('.digest-grid .digest-card, .digest-card')){const visibleImages=Array.from(doc.querySelectorAll('#main img, #main svg image')).filter(i=>i.getBoundingClientRect().top<innerHeight+300);Promise.all(visibleImages.map(img=>img.tagName.toLowerCase()==='image'?new Promise(resolve=>{const probe=new Image();probe.onload=probe.onerror=resolve;probe.src=new URL(img.getAttribute('href')||img.getAttributeNS('http://www.w3.org/1999/xlink','href'),doc.baseURI).href;if(probe.complete)resolve();}):img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});}))).then(markReady);clearTimeout(readyTimeout);readyTimeout=setTimeout(markReady,2200);}}
frame.addEventListener('load',()=>{const doc=getDoc();if(!doc){$('#readiness').textContent='備份頁暫時無法讀取，可先跳過片頭。';return;}if(doc.querySelector('#main')){observer?.disconnect();observer=new MutationObserver(inspectReady);observer.observe(doc.querySelector('#main'),{childList:true,subtree:true});inspectReady();}else{$('#readiness').textContent='備份頁暫時無法讀取，可先跳過片頭。';}});
$('#replay').addEventListener('click',replay);$('#skip').addEventListener('click',()=>{autoStart=false;finish('skip');});reduced.addEventListener('change',()=>{if(reduced.checked){autoStart=false;finish('reduced');}});media.addEventListener('change',e=>{reduced.checked=e.matches;if(e.matches){autoStart=false;finish('reduced');}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){autoStart=false;finish('skip');}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)finish('skip');});window.addEventListener('pagehide',()=>finish('skip'));window.addEventListener('resize',()=>{if(playing)paintProgress(elapsed);});
window.qafPreview={replay,skip:()=>{autoStart=false;finish('skip');},seek(ms){if(!playing)replay();if(!playing)return;held=true;cancelAnimationFrame(raf);render(ms);},getState(){return{ready,playing,held,elapsed,reduced:reduced.checked,phase:$('#progress').dataset.phase||'0',animationCount:animations.length};}};
loadTimeout=setTimeout(()=>{if(!ready){autoStart=false;finish('skip');$('#status').textContent='直接顯示備份頁的實際載入狀態。';}},12000);
if(reduced.checked){autoStart=false;finish('reduced');}
frame.src='news-backup.html#news';
})();
</script></body></html>
