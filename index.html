  <script>
const pageSizes = {"band":7780,"column-lab":225451,"column-qaf":177156,"columns":310822,"design-instagram":1837474,"design-qaf1":43528,"design-qaf2":1873079,"design-setup":469,"design-wiring":148180,"design":727,"guide":22138,"home":158443,"magazines-book":508093,"magazines-magazine":266230,"magazines-score":482777,"magazines-video":2550216,"memory":79907,"my-music":19516,"news":163998,"nodes":14157,"overview":6309,"shops":175146,"viewpoints":21531};
const routes = new Map([
  ['home','home'], ['my-music','my-music'], ['overview','overview'],
  ['memory','memory'], ['nodes','nodes'], ['guide','guide'],
  ['viewpoints','viewpoints'], ['band','band'],
  ['magazines','magazines-magazine'],
  ['magazines/magazine','magazines-magazine'],
  ['magazines/book','magazines-book'],
  ['magazines/score','magazines-score'],
  ['magazines/video','magazines-video'],
  ['columns','columns'], ['column/column-qaf','column-qaf'],
  ['column/column-lab','column-lab'], ['news','news'],
  ['shops','shops'], ['design','design'],
  ['design/qaf1','design-qaf1'], ['design/qaf2','design-qaf2'],
  ['design/wiring','design-wiring'], ['design/setup','design-setup'],
  ['design/instagram','design-instagram'],
]);
const main = document.getElementById('main');
let current = '';

function loadingMarkup() {
  return '<div class="preview-loading" role="status" aria-live="polite">'
    + '<p class="preview-loading-label">載入中 · <span class="preview-percent">0%</span></p>'
    + '<div class="preview-progress" role="progressbar" aria-label="正在載入" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div></div>';
}

function routeFromHash() {
  const hash = decodeURIComponent(location.hash.slice(1));
  if (routes.has(hash)) return hash;
  if (hash && main.querySelector(`#${CSS.escape(hash)}`)) return current;
  if (hash.startsWith('guide-')) return 'guide';
  if (hash.startsWith('memory-')) return 'memory';
  return 'home';
}

async function showRoute() {
  const route = routeFromHash();
  if (route === current) {
    const anchor = decodeURIComponent(location.hash.slice(1));
    if (anchor && !routes.has(anchor)) document.getElementById(anchor)?.scrollIntoView();
    return;
  }
  current = route;
  const name = routes.get(route);
  main.innerHTML = loadingMarkup();
  try {
    const response = await fetch(`qaf-page-${name}.html?v=20261001-memory2`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const total = pageSizes[name] || 0;
    const reader = response.body?.getReader();
    let markup;
    if (reader) {
      const parts = [];
      let bytes = 0;
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        parts.push(value);
        bytes += value.byteLength;
        if (route === current) {
          const percent = Math.min(99, Math.round(bytes / total * 100));
          const label = main.querySelector('.preview-percent');
          if (label) label.textContent = `${percent}%`;
          const bar = main.querySelector('.preview-progress');
          if (bar && total) {
            bar.firstElementChild.style.width = `${percent}%`;
            bar.setAttribute('aria-valuenow', String(percent));
          }
        }
      }
      const buffer = new Uint8Array(bytes);
      let offset = 0;
      for (const part of parts) { buffer.set(part, offset); offset += part.byteLength; }
      markup = new TextDecoder().decode(buffer);
    } else {
      markup = await response.text();
    }
    const percent = main.querySelector('.preview-percent');
    const bar = main.querySelector('.preview-progress');
    if (percent) percent.textContent = '100%';
    if (bar) { bar.firstElementChild.style.width = '100%'; bar.setAttribute('aria-valuenow', '100'); }
    await new Promise(resolve => requestAnimationFrame(resolve));
    if (route !== current) return;
    main.innerHTML = markup;
    main.querySelectorAll('figure.preview-authentic-image').forEach(figure => figure.remove());
    for (const link of document.querySelectorAll('.primary-nav a')) {
      link.setAttribute('aria-current', route === link.dataset.section || route.startsWith(link.dataset.section + '/') ? 'page' : 'false');
    }
    document.title = `${document.querySelector('.primary-nav a[aria-current="page"]')?.textContent || 'QAF'}｜QAF 音樂學習`;
    if (route.startsWith('magazines')) wireBookToolbar();
    if (route === 'memory') { wireMemoryNotes(); wireMemoryBoard(); MemoryFifths.mount(); MemoryBasics.mount(); WorldScaleWheel.mount(); }
    if (route === 'band') wireBandVideos();
    if (route === 'column/column-lab') wireLabColumn();
    if (route === 'column/column-qaf') wireQafColumn();
    if (route === 'design/qaf2') wireQaf2Gallery();
    if (route === 'viewpoints') wireViewpoints();
    const anchor = decodeURIComponent(location.hash.slice(1));
    if (anchor && !routes.has(anchor)) {
      document.getElementById(anchor)?.scrollIntoView();
    } else {
      window.scrollTo(0, 0);
    }
  } catch {
    main.innerHTML = '<p class="preview-error">此頁暫時無法載入，請重新整理。</p>';
  }
}

function wireLabColumn() {
  const article = main.querySelector('article.post-entry');
  const gallery = article?.querySelector('.post-image-gallery');
  const copy = article?.querySelector('.hub-copy');
  if (!gallery || !copy) return;
  const figures = [...gallery.querySelectorAll('figure')].filter((_, index) => index !== 1);
  const paragraphs = copy.textContent.split(/\n\s*\n/).map(text => text.trim()).filter(Boolean);
  const groups = [[1], [2, 3], [4]];
  const titles = [paragraphs[0], '本來會暈車，現在有煞車', '可以加裝延伸踏板'];
  const rubberneck = figures[1];
  const rubberneckImage = rubberneck?.querySelector('img');
  if (rubberneckImage) {
    rubberneckImage.src = 'assets/dod-rubberneck-official.jpg';
    rubberneckImage.alt = 'DOD Rubberneck 類比延遲效果器正面，圖片來源：DOD／DigiTech';
    const caption = rubberneck.querySelector('figcaption');
    if (caption) caption.textContent = 'DOD Rubberneck 正面｜圖片來源：DOD／DigiTech';
  }
  const features = document.createElement('div');
  features.className = 'column-lab-features';
  figures.forEach((figure, index) => {
    const row = document.createElement('section');
    row.className = 'column-lab-feature';
    const text = document.createElement('div');
    text.className = 'column-lab-copy';
    const heading = document.createElement('h4');
    heading.textContent = titles[index];
    text.append(heading);
    for (const part of groups[index] || []) {
      if (!paragraphs[part]) continue;
      const p = document.createElement('p');
      p.textContent = paragraphs[part];
      text.append(p);
    }
    if (index === 2) {
      const extension = document.createElement('p');
      extension.textContent = '想把這場飆車玩得更順手，還可以接上選購的 DigiTech FS3X 三鍵延伸踏板。Tap Tempo、Curve 開關與 Friction 操作都能交給腳下；原廠附的磁吸面板貼上去，連踏板都像一起進了維修站。';
      const invitation = document.createElement('p');
      invitation.textContent = '快來聽吧。';
      text.append(extension, invitation);
    }
    row.append(figure, text);
    features.append(row);
  });
  gallery.replaceWith(features);
  copy.remove();
}

function wireQafColumn() {
  const article = main.querySelector('article.post-entry');
  const gallery = article?.querySelector('.post-image-gallery');
  const titleCopy = gallery?.nextElementSibling;
  const leadCopy = titleCopy?.nextElementSibling;
  if (!gallery || !titleCopy?.classList.contains('hub-copy') || !leadCopy?.classList.contains('hub-copy')) return;
  gallery.querySelector('figure')?.classList.add('friend-qaf-first-image');
  const intro = document.createElement('div');
  intro.className = 'friend-qaf-intro';
  const text = document.createElement('div');
  text.className = 'friend-qaf-intro-copy';
  const heading = document.createElement('h3');
  heading.textContent = titleCopy.textContent.trim();
  const lead = document.createElement('p');
  lead.textContent = leadCopy.textContent.trim();
  const murmurLabel = document.createElement('p');
  murmurLabel.className = 'friend-qaf-murmur-label';
  murmurLabel.textContent = 'MURMUR';
  const murmur = document.createElement('p');
  murmur.textContent = '畫圖時想的是造型，練團時想的卻是手能不能在下一拍找到那個聲音。QAF.1 的電路，就是從這個小小的任性長出來的。';
  text.append(heading, lead, murmurLabel, murmur);
  gallery.replaceWith(intro);
  intro.append(gallery, text);
  titleCopy.remove();
  leadCopy.remove();
}

function wireViewpoints() {
  const select = main.querySelector('#view-category');
  const container = main.querySelector('#viewpoint-cards');
  if (!select || !container) return;
  const cards = [...container.querySelectorAll('article')];
  const categories = [...new Set(cards.map(card => card.querySelector('.badge')?.textContent.trim()).filter(Boolean))];
  for (const category of categories) {
    if (![...select.options].some(option => option.value === category)) select.add(new Option(category, category));
  }
  const count = document.createElement('p');
  count.className = 'preview-view-count muted';
  container.before(count);
  const filter = () => {
    const wanted = select.value;
    let visible = 0;
    for (const card of cards) {
      card.hidden = wanted !== '全部' && card.querySelector('.badge')?.textContent.trim() !== wanted;
      if (!card.hidden) visible++;
    }
    count.textContent = `顯示 ${visible} / ${cards.length} 則觀點`;
  };
  select.addEventListener('change', filter);
  filter();
}

function wireQaf2Gallery() {
  const root = main.querySelector('#qaf-workbook');
  const data = root?.querySelector('#friend-qaf2-data');
  const grid = root?.querySelector('#app-grid');
  if (!data || !grid) return;
  const {catalog, selected} = JSON.parse(data.textContent);
  const selectedIds = new Set(selected);
  let revision = 'all', selectedOnly = false, view = 'body', page = 1;
  const pageSize = 30;
  const filter = root.querySelector('#revision-filter');
  const chosen = root.querySelector('#selected-only');
  const previous = root.querySelector('#previous');
  const next = root.querySelector('#next');
  filter.disabled = false;
  chosen.disabled = false;
  filter.value = 'all';
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const art = item => `<svg viewBox="${(view === 'body' ? item.bodyBox : item.fullBox).join(' ')}" role="img" aria-label="方案 ${item.code} ${view === 'body' ? '琴身' : '完整吉他'}"><use href="#study-${item.id}"></use></svg>`;
  const matches = item => (revision === 'all' || (revision === 'early' ? item.revision.startsWith('E') : item.revision === revision)) && (!selectedOnly || selectedIds.has(item.id));
  function render() {
    const items = catalog.filter(matches);
    const pages = Math.max(1, Math.ceil(items.length / pageSize));
    page = Math.min(page, pages);
    const slice = items.slice((page - 1) * pageSize, page * pageSize);
    grid.innerHTML = slice.map(item => `<article class="study ${selectedIds.has(item.id) ? 'chosen' : ''}" data-id="${item.id}"><div class="card-head"><strong class="card-number mono">${esc(item.code)}</strong><span class="old-code">${esc(item.revision)} · 原 ${esc(item.original)}</span></div><button class="art-button" data-preview-design="${item.id}" aria-label="放大方案 ${esc(item.code)}">${art(item)}</button><div class="study-meta">${esc(item.name)}</div><div class="card-bottom"><span class="friend-selection">${selectedIds.has(item.id) ? '✓ 原本已勾選' : '未勾選'} · ${esc(item.width)}</span></div></article>`).join('');
    root.querySelector('#result-count').textContent = items.length ? `顯示 ${(page - 1) * pageSize + 1}–${Math.min(page * pageSize, items.length)} / ${items.length} 張` : '0 張';
    root.querySelector('#page-count').textContent = `${page} / ${pages}`;
    previous.disabled = page <= 1;
    next.disabled = page >= pages;
    root.querySelectorAll('[data-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === view)));
  }
  filter.addEventListener('change', () => { revision = filter.value; page = 1; render(); });
  chosen.addEventListener('change', () => { selectedOnly = chosen.checked; page = 1; render(); });
  root.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => { view = button.dataset.view; render(); }));
  previous.addEventListener('click', () => { page--; render(); root.querySelector('.collection-intro').scrollIntoView(); });
  next.addEventListener('click', () => { page++; render(); root.querySelector('.collection-intro').scrollIntoView(); });
  grid.addEventListener('click', event => {
    const button = event.target.closest('[data-preview-design]');
    if (!button) return;
    const item = catalog.find(entry => entry.id === Number(button.dataset.previewDesign));
    if (!item) return;
    const dialog = root.querySelector('#detail-dialog');
    root.querySelector('#detail-title').textContent = `方案 ${item.code}`;
    root.querySelector('#detail-subtitle').textContent = `${item.revision} · 原 ${item.original} · ${item.name}`;
    root.querySelector('#detail-art').innerHTML = `<svg viewBox="${item.fullBox.join(' ')}" role="img" aria-label="完整吉他"><use href="#study-${item.id}"></use></svg><svg viewBox="${item.bodyBox.join(' ')}" role="img" aria-label="琴身"><use href="#study-${item.id}"></use></svg>`;
    dialog.showModal();
  });
  root.querySelectorAll('#detail-dialog [data-close]').forEach(button => button.addEventListener('click', () => root.querySelector('#detail-dialog').close()));
  render();
}

function wireBandVideos() {
  main.querySelectorAll('.band-video-poster[data-video-id]').forEach(button => {
    button.addEventListener('click', () => {
      const id = button.dataset.videoId;
      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
      const iframe = document.createElement('iframe');
      iframe.className = 'hub-video';
      iframe.title = `${button.dataset.videoTitle || '練團曲'} 影片`;
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
      iframe.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';
      button.replaceWith(iframe);
    });
  });
}

function wireMemoryNotes() {
  const select = main.querySelector('#memory-note');
  const hide = main.querySelector('#memory-hide');
  const board = main.querySelector('#memory-board');
  const answer = main.querySelector('#memory-answer');
  if (!select || !hide || !board || !answer) return;
  const opens = [4, 11, 7, 2, 9, 4];
  const labels = ['1弦 E', '2弦 B', '3弦 G', '4弦 D', '5弦 A', '6弦 E'];
  const svgNS = 'http://www.w3.org/2000/svg';
  const add = (parent, tag, attributes, content) => {
    const node = document.createElementNS(svgNS, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
    if (content !== undefined) node.textContent = content;
    parent.append(node);
  };
  function redraw() {
    const pitch = Number(select.value);
    const hidden = hide.checked;
    if (!Number.isInteger(pitch) || pitch < 0 || pitch > 11) return;
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 790 230');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `標準調弦 0 到 12 格的 ${select.selectedOptions[0].textContent} 位置，第一弦在上`);
    add(svg, 'rect', {x:70, y:35, width:690, height:160, rx:8, fill:'#f4ece0'});
    for (let fret = 0; fret <= 12; fret++) {
      const x = 90 + fret * 54;
      add(svg, 'text', {x, y:22, 'text-anchor':'middle', 'font-size':13}, fret);
      if (fret) add(svg, 'line', {x1:x-27, y1:35, x2:x-27, y2:195, stroke:'#bdb4a5'});
    }
    for (let string = 0; string < 6; string++) {
      const y = 48 + string * 27;
      add(svg, 'text', {x:4, y:y+5, 'font-size':13}, labels[string]);
      add(svg, 'line', {x1:75, y1:y, x2:760, y2:y, stroke:'#8d958d', 'stroke-width':1+string*.2});
      if (hidden) continue;
      for (let fret = 0; fret <= 12; fret++) {
        if ((opens[string] + fret) % 12 !== pitch) continue;
        const x = 90 + fret * 54;
        add(svg, 'circle', {cx:x, cy:y, r:12, fill:'#267461'});
        add(svg, 'text', {x, y:y+4, 'text-anchor':'middle', fill:'white', 'font-size':11}, fret);
      }
    }
    board.replaceChildren(svg);
    answer.textContent = hidden ? '已遮住答案：先彈，再在紙上畫出，最後取消勾選核對。'
      : '0–12格位置（六弦→一弦）：' + [...opens].reverse().map((open, index) => `${6-index}弦 ${Array.from({length:13}, (_, fret) => fret).filter(fret => (open+fret)%12 === pitch).join('/')}格`).join('；');
  }
  select.addEventListener('change', redraw);
  hide.addEventListener('change', redraw);
  redraw();
}

function wireBookToolbar() {
  const categories = {magazine:'magazine', textbook:'book', scores:'score', video:'video'};
  main.querySelectorAll('[data-category]').forEach(button => {
    button.addEventListener('click', () => {
      const next = categories[button.dataset.category];
      if (next) location.hash = `magazines/${next}`;
    });
  });
  const search = main.querySelector('#book-search');
  if (search) search.addEventListener('input', () => {
    const term = search.value.trim().toLocaleLowerCase();
    main.querySelectorAll('.magazine-card').forEach(card => {
      card.hidden = term && !card.textContent.toLocaleLowerCase().includes(term);
    });
  });
  if (current === 'magazines/score') wireScorePreview();
}

function wireScorePreview() {
  const cards = [...main.querySelectorAll('#books-grid .magazine-card')];
  const count = main.querySelector('#books-count');
  const pager = main.querySelector('#books-pages');
  if (count) count.textContent = `樂譜展示 · ${cards.length} 本封面（正式庫共 48 本）`;
  if (pager) pager.innerHTML = '<span>展示版僅提供封面與書目；原始樂譜留在私人資料庫。</span>';
  const dialog = document.createElement('dialog');
  dialog.className = 'preview-score-dialog';
  dialog.innerHTML = '<button type="button" class="preview-score-close" aria-label="關閉預覽">×</button><div class="preview-score-content"></div>';
  main.append(dialog);
  dialog.querySelector('button').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  for (const card of cards) {
    const cover = card.querySelector('a[data-read]');
    if (!cover) continue;
    cover.href = '#';
    cover.removeAttribute('target');
    cover.setAttribute('aria-label', `預覽 ${card.querySelector('h3')?.textContent || '樂譜'} 的封面`);
    cover.addEventListener('click', event => {
      event.preventDefault();
      const image = card.querySelector('img');
      const title = card.querySelector('h3')?.textContent || '樂譜';
      const details = [...card.querySelectorAll('small')].map(node => node.textContent).filter(Boolean);
      const content = dialog.querySelector('.preview-score-content');
      content.replaceChildren();
      const picture = document.createElement('img');
      picture.src = image.src;
      picture.alt = `${title} 封面預覽`;
      const info = document.createElement('div');
      const heading = document.createElement('h3');
      heading.textContent = title;
      info.append(heading);
      for (const detail of details) {
        const line = document.createElement('p');
        line.textContent = detail;
        info.append(line);
      }
      const note = document.createElement('p');
      note.textContent = '朋友展示版不提供原始 PDF。';
      info.append(note);
      content.append(picture, info);
      dialog.showModal();
    });
  }
}
