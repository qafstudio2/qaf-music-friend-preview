  <script>
const routes = new Map([
  ['memory','memory'], ['nodes','nodes'], ['guide','guide'],
  ['viewpoints','viewpoints'], ['band','band'],
  ['magazines','magazines-magazine'],
  ['magazines/magazine','magazines-magazine'],
  ['magazines/book','magazines-book'],
  ['magazines/score','magazines-score'],
  ['magazines/video','magazines-video'],
  ['columns','columns'], ['column/column-qaf','column-qaf'],
  ['column/column-lab','column-lab'], ['news','news'],
  ['shops','shops'], ['design','design'],
  ['design/qaf1','design-qaf1'], ['design/qaf2','design-qaf2'],
  ['design/wiring','design-wiring'], ['design/setup','design-setup'],
  ['design/instagram','design-instagram'],
]);
const main = document.getElementById('main');
let current = '';

function routeFromHash() {
  const hash = decodeURIComponent(location.hash.slice(1));
  return routes.has(hash) ? hash : 'memory';
}

async function showRoute() {
  const route = routeFromHash();
  if (route === current) return;
  current = route;
  const name = routes.get(route);
  main.innerHTML = '<div class="preview-loading">正在載入頁面…<div class="preview-progress" role="progressbar" aria-label="正在載入"><span></span></div></div>';
  try {
    const response = await fetch(`qaf-page-${name}.html`);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const total = Number(response.headers.get('content-length')) || 0;
    const reader = response.body?.getReader();
    let markup;
    if (reader) {
      const parts = [];
      let bytes = 0;
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        parts.push(value);
        bytes += value.byteLength;
        if (route === current) {
          const label = main.querySelector('.preview-loading');
          if (label) label.firstChild.textContent = `正在載入頁面… 已接收 ${Math.round(bytes / 1024)} KB`;
          const bar = main.querySelector('.preview-progress');
          if (bar && total && !response.headers.get('content-encoding')) {
            bar.classList.add('measured');
            bar.firstElementChild.style.width = `${Math.min(95, Math.round(bytes / total * 100))}%`;
          }
        }
      }
      const buffer = new Uint8Array(bytes);
      let offset = 0;
      for (const part of parts) { buffer.set(part, offset); offset += part.byteLength; }
      markup = new TextDecoder().decode(buffer);
    } else {
      markup = await response.text();
    }
    if (route !== current) return;
    main.innerHTML = markup;
    for (const link of document.querySelectorAll('.primary-nav a')) {
      link.setAttribute('aria-current', route === link.dataset.section || route.startsWith(link.dataset.section + '/') ? 'page' : 'false');
    }
    document.title = `${document.querySelector('.primary-nav a[aria-current="page"]')?.textContent || 'QAF'}｜QAF 音樂學習`;
    if (route.startsWith('magazines')) wireBookToolbar();
    if (route === 'memory') wireMemoryBoard();
    window.scrollTo(0, 0);
  } catch {
    main.innerHTML = '<p class="preview-error">此頁暫時無法載入，請重新整理。</p>';
  }
}

function wireMemoryBoard() {
  const panel = main.querySelector('#memory-sevenths');
  const board = panel?.querySelector('#seventh-board svg');
  const summary = panel?.querySelector('#seventh-summary');
  if (!board || !summary) return;
  const chordTypes = {
    Cmaj7: {tones:{0:'1',4:'3',7:'5',11:'7'}, notes:'C · E · G · B', hint:'大三和弦加大七度。'},
    Cm7: {tones:{0:'1',3:'♭3',7:'5',10:'♭7'}, notes:'C · E♭ · G · B♭', hint:'Cmaj7 的 3 與 7 各降半音。'},
    C7: {tones:{0:'1',4:'3',7:'5',10:'♭7'}, notes:'C · E · G · B♭', hint:'Cmaj7 只把 7 降半音，保留大三度。'},
    Cdim7: {tones:{0:'1',3:'♭3',6:'♭5',9:'♭♭7'}, notes:'C · E♭ · G♭ · B♭♭', hint:'減七和弦由四個小三度堆疊；B♭♭ 與 A 同音。'}
  };
  const opens = [4,11,7,2,9,4];
  const svgNS = 'http://www.w3.org/2000/svg';
  const shapeButtons = [...panel.querySelectorAll('.shape-buttons button')];
  let activeShape = null;
  const element = (name, attrs) => {
    const item = document.createElementNS(svgNS, name);
    Object.entries(attrs).forEach(([key,value]) => item.setAttribute(key, String(value)));
    return item;
  };
  function focusShape(name) {
    activeShape = name;
    board.querySelectorAll('g[data-shape]').forEach(group => {
      group.setAttribute('opacity', !name || group.dataset.shape === name ? '1' : '0.13');
    });
    shapeButtons.forEach(button => {
      const selected = name ? button.textContent.trim().startsWith(name + ' 形') : button.textContent.includes('顯示全部');
      button.setAttribute('aria-pressed', String(selected));
    });
  }
  function chooseSeventh(type) {
    const chord = chordTypes[type];
    if (!chord) return;
    board.querySelectorAll('g[data-string]').forEach(group => group.remove());
    for (let string=0; string<6; string++) {
      const y = 237 + string*31;
      for (let fret=0; fret<=24; fret++) {
        const pitchClass = (opens[string] + fret) % 12;
        const degree = chord.tones[pitchClass];
        if (!degree) continue;
        const x = 80 + fret*46;
        const group = element('g', {'data-string':string+1, 'data-fret':fret, 'data-degree':degree});
        const title = element('title', {});
        title.textContent = `${type}：${string+1}弦${fret}品，${degree}`;
        group.append(title, element('circle', {cx:x,cy:y,r:14,fill:pitchClass===0?'#176a55':'#bc6634'}));
        const label = element('text', {x,y:y+5,'text-anchor':'middle',fill:'white','font-size':degree.length>2?12:14,'font-weight':600});
        label.textContent = degree;
        group.append(label);
        board.append(group);
      }
    }
    board.setAttribute('aria-label', `${type} 的 0 至 24 品全指板琶音`);
    summary.textContent = `${type}：${chord.notes}。${chord.hint}`;
    panel.querySelectorAll('[data-seventh]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.seventh===type)));
  }
  shapeButtons.forEach((button,index) => button.addEventListener('click', () => focusShape(index<5 ? ['C','A','G','E','D'][index] : null)));
  panel.querySelectorAll('[data-seventh]').forEach(button => button.addEventListener('click', () => chooseSeventh(button.dataset.seventh)));
  board.addEventListener('click', event => {
    const label = event.target.closest('[role="button"]');
    focusShape(label?.closest('g[data-shape]')?.dataset.shape || null);
  });
  board.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const label = event.target.closest('[role="button"]');
    if (!label) return;
    event.preventDefault();
    focusShape(label.closest('g[data-shape]')?.dataset.shape || null);
  });
  focusShape(null);
}

function wireBookToolbar() {
  const categories = {magazine:'magazine', textbook:'book', score:'score', video:'video'};
  main.querySelectorAll('[data-category]').forEach(button => {
    button.addEventListener('click', () => {
      const next = categories[button.dataset.category];
      if (next) location.hash = `magazines/${next}`;
    });
  });
  const search = main.querySelector('#book-search');
  if (search) search.addEventListener('input', () => {
    const term = search.value.trim().toLocaleLowerCase();
    main.querySelectorAll('.magazine-card').forEach(card => {
      card.hidden = term && !card.textContent.toLocaleLowerCase().includes(term);
    });
  });
}

window.addEventListener('hashchange', showRoute);
document.getElementById('back-to-top').addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));
showRoute();

</script>
