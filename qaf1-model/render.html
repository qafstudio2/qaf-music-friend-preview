<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QAF1｜全琴與近照</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#fff;color:#242424;font:15px/1.6 system-ui,"Microsoft JhengHei",sans-serif}header{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}header strong{margin-right:10px}button{font:inherit;border:0;background:none;color:#555;padding:6px 9px;cursor:pointer}button[aria-pressed=true]{font-weight:750;color:#111}button:focus-visible,a:focus-visible{outline:2px solid #526969;outline-offset:3px}a{color:#354c50;text-underline-offset:4px;margin-left:10px}.download{margin-left:auto}.note{font-size:13px;color:#606569;margin:0 0 12px}figure{margin:0;border:1px solid #c8cbcc;background:white;text-align:center}img{display:block;max-width:100%;width:auto;max-height:min(810px,calc(100vh - 160px));margin:auto;object-fit:contain}figcaption{font-size:13px;background:#fff;color:#606569;padding:9px;text-align:left;border-top:1px solid #e6e6e6}@media(max-width:700px){body{padding:10px}img{max-height:72vh}.download{margin-left:8px}}</style>
<header aria-label="照片檢視"><strong>QAF1</strong><button data-image="QAF1-R14-photo.png" aria-pressed="true">全琴</button><button data-image="QAF1-BETA-宣傳照.png" aria-pressed="false">宣傳照</button><button data-image="QAF1-R14-head.png" aria-pressed="false">琴頭</button><button data-image="QAF1-R14-body.png" aria-pressed="false">琴身</button><button data-image="QAF1-R14-ebony.png" aria-pressed="false">Ebony 指板</button><button data-image="QAF1-R14-hardware.png" aria-pressed="false">五金</button><button data-image="QAF1-R14-wing.png" aria-pressed="false">左翼</button><a href="model.html">模型討論</a><a class="download" id="download" href="QAF1-R14-photo.png" download>下載原圖</a></header>
<p class="note">Ebony 指板微光澤 · 拋光透明深紅壓克力 · R14 · 2026-10-02</p>
<figure><img id="render" src="QAF1-R14-photo.png" alt="QAF1 全琴照片"><figcaption id="caption" aria-live="polite">全琴 · 已確認琴頭與琴身整合</figcaption></figure>
<script>for(const b of document.querySelectorAll('button[data-image]'))b.onclick=()=>{const img=document.getElementById('render');img.src=b.dataset.image;img.alt='QAF1 '+b.textContent+'照片';document.getElementById('download').href=b.dataset.image;document.getElementById('caption').textContent=b.textContent+(b.dataset.image.includes('宣傳照')?'QAF.1 BETA · 宣傳照':b.dataset.image.includes('-head.')?' · 已確認的琴頭近照':b.dataset.image.includes('-photo.')?' · 已確認琴頭與琴身整合':' · 全琴照片局部近看');for(const t of document.querySelectorAll('button[data-image]'))t.setAttribute('aria-pressed',String(t===b));};</script></html>
