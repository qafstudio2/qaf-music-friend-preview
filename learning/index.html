<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="QAF 吉他學習專區：每日記憶、學習節點、學習地圖與書籍觀點。">
  <link rel="canonical" href="https://qaf.tw/music/learning/">
  <link rel="stylesheet" href="../section-home.css?v=20261016-frame4">
  <title>吉他學習專區 — QAF</title>
  <script>(function(){
  const key = 'qaf-home-transition';
  const destinations = new Set(['/', '/architecture/', '/music/learning/', '/music/workshop/']);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduceMotion && sessionStorage.getItem(key) === location.pathname) {
    document.documentElement.classList.add('home-arriving');
    sessionStorage.removeItem(key);
    addEventListener('DOMContentLoaded', () => requestAnimationFrame(() => requestAnimationFrame(() => {
      document.documentElement.classList.remove('home-arriving');
    })), {once:true});
  }
  addEventListener('pageshow', event => {
    if (event.persisted) {
      document.documentElement.classList.remove('home-leaving', 'home-arriving');
      sessionStorage.removeItem(key);
    }
  });
  addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', event => {
      const link = event.target.closest('a[href]');
      if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || reduceMotion) return;
      const target = new URL(link.href, location.href);
      if (target.origin !== location.origin || !destinations.has(target.pathname) || target.pathname === location.pathname) return;
      event.preventDefault();
      sessionStorage.setItem(key, target.pathname);
      document.documentElement.classList.add('home-leaving');
      setTimeout(() => { location.href = target.href; }, 460);
    });
  }, {once:true});
})();
</script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand"><a href="https://qaf.tw/" aria-label="回到 QAF 總首頁"><img src="../assets/qaf-main-logo.png" alt="QAF 標誌"></a><a class="brand-title" href="./?v=ca91a89">吉他學習專區</a></div>
      <a class="login" id="account-link" href="https://qaf.tw/account/start?next=music">LOGIN</a>
    </header>
    <main class="composition">
      <section class="art" aria-labelledby="title">
        <h1 id="title">GUITAR LESSON</h1>
        <p class="sub">吉他學習專區<br>DAILY PRACTICE AND LEARNING</p>
        <img src="../assets/qaf-guitar-lineart.png" alt="QAF.1 雙向電吉他的黑白線稿">
        <p class="credit">QAF.1 / GUITAR STUDY</p>
      </section>
      <nav class="entries" id="learning-entries" aria-label="吉他學習入口">
        <a class="entry" href="../?v=20261015-section-home#memory"><small>每日記憶</small><strong>DAILY MEMORY</strong></a>
        <a class="entry" href="../?v=20261015-section-home#nodes"><small>學習節點</small><strong>LEARNING NODES</strong></a>
        <a class="entry" href="../?v=20261015-section-home#guide"><small>學習地圖</small><strong>LEARNING MAP</strong></a>
        <a class="entry" href="../?v=20261015-section-home#viewpoints"><small>書籍觀點</small><strong>VIEWPOINTS</strong></a>
      </nav>
    </main>
    <footer><span>QAF.</span><span>GUITAR / LEARNING / PRACTICE</span></footer>
  </div>
  <script>
    fetch('/account/whoami',{credentials:'same-origin',cache:'no-store'}).then(async response=>{
      if(!response.ok)return;
      const account=await response.json();
      if(typeof account.id!=='string'||!account.id)return;
      const login=document.getElementById('account-link');
      login.textContent='ID: '+account.id;
      login.href='../?v=20261015-section-home#memory';
      const nav=document.getElementById('learning-entries');
      for(const [route,label,title] of [
        ['band','練習曲','PRACTICE SONGS'],
        ['magazines','雜誌／教材','MATERIALS'],
        ['my-music','我的音樂','MY MUSIC']
      ].reverse()){
        const link=document.createElement('a');link.className='entry';
        link.href='../?v=20261015-section-home#'+route;
        const small=document.createElement('small');small.textContent=label;
        const strong=document.createElement('strong');strong.textContent=title;
        link.append(small,strong);nav.prepend(link);
      }
    }).catch(()=>{});
  </script>
</body>
</html>
